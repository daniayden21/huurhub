<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Woning · HuurHub</title>
<link rel="icon" href="/img/favicon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/style.css">
<style>
.crumbs { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--text-2); padding-block: 22px 18px; flex-wrap: wrap; }
.crumbs a { color: var(--text-2); text-decoration: none; display: inline-flex; gap: 6px; align-items: center; font-weight: 600; }
.crumbs a:hover { color: var(--navy); }
.gallery { display: grid; grid-template-columns: 2fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; height: min(480px, 52vw); border-radius: var(--r-lg); overflow: hidden; position: relative; }
.gallery button { border: 0; padding: 0; background: var(--blue-bg) center/cover no-repeat; cursor: zoom-in; position: relative; }
.gallery button:first-child { grid-row: 1 / 3; }
.gallery.n1 { grid-template-columns: 1fr; grid-template-rows: 1fr; height: min(440px, 56vw); } .gallery.n1 button:first-child { grid-row: auto; }
.gallery.n2 { grid-template-columns: 3fr 2fr; grid-template-rows: 1fr; } .gallery.n2 button:first-child { grid-row: auto; }
.gallery.n3 button:nth-child(2) { grid-column: 2 / 4; } .gallery.n3 button:nth-child(3) { grid-column: 2 / 4; }
.gallery.n4 button:nth-child(4) { grid-column: 3 / 4; grid-row: 2; } .gallery.n4 button:nth-child(3) { grid-column: 2 / 3; grid-row: 2; } .gallery.n4 button:nth-child(2) { grid-column: 2 / 4; }
.gallery .all { position: absolute; right: 14px; bottom: 14px; z-index: 2; }
.gallery .noimg { display: grid; place-items: center; color: #b7c4d6; background: var(--blue-bg); cursor: default; }
.gallery .noimg svg { width: 64px; height: 64px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 48px; padding-block: 32px 80px; align-items: start; }
.head h1 { font-size: clamp(28px, 3.4vw, 38px); }
.loc { display: flex; gap: 6px; align-items: center; color: var(--text-2); font-weight: 600; margin-top: 8px; }
.badges { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 28px; }
.fact { border: 1px solid var(--border); border-radius: var(--r); padding: 16px; display: grid; gap: 6px; }
.fact .icon { width: 22px; height: 22px; color: var(--orange); }
.fact span { font-size: 13px; color: var(--text-2); font-weight: 600; }
.fact b { font-size: 16px; }
.block { margin-top: 40px; display: grid; gap: 14px; }
.block h2 { font-size: 22px; }
.desc { color: var(--text-2); white-space: pre-line; max-width: 72ch; }
.desc.clamp { display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden; }
.feats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 24px; list-style: none; padding: 0; margin: 0; }
.feats li { display: flex; gap: 10px; align-items: center; font-weight: 500; }
.feats li .icon { color: var(--green); }
.steps { display: grid; gap: 12px; counter-reset: s; list-style: none; padding: 0; margin: 0; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 32px 1fr; gap: 12px; color: var(--text-2); }
.steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--blue-bg); color: var(--navy); font-weight: 800; display: grid; place-items: center; font-size: 13px; }
.steps b { color: var(--navy); }
#minimap { height: 300px; border-radius: var(--r-lg); border: 1px solid var(--border); }
.cta { position: sticky; top: 96px; border: 1px solid var(--border); border-radius: var(--r-lg); padding: 24px; box-shadow: var(--shadow); display: grid; gap: 14px; background: #fff; }
.cta .price { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; }
.cta .price small { font-size: 15px; color: var(--text-2); font-weight: 600; letter-spacing: 0; }
.cta dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; font-size: 14.5px; }
.cta dt { color: var(--text-2); }
.cta dd { margin: 0; font-weight: 700; text-align: right; }
.cta hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
.cta .note { font-size: 13px; color: var(--text-2); }
.cta .row { display: flex; gap: 10px; }
.cta .row .btn { flex: 1; }
.cta select { width: 100%; height: 44px; border: 1.5px solid var(--border); border-radius: var(--r-sm); padding: 0 12px; font-weight: 600; background: #fff; }
.similar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
.lightbox { position: fixed; inset: 0; z-index: 4000; background: rgb(7 32 69 / .94); display: grid; grid-template-rows: auto 1fr auto; color: #fff; }
.lightbox header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; }
.lightbox .stage { display: grid; place-items: center; min-height: 0; padding: 0 64px; position: relative; }
.lightbox .stage img { max-height: 100%; max-width: 100%; object-fit: contain; border-radius: 10px; }
.lightbox .nav-b { position: absolute; top: 50%; transform: translateY(-50%); }
.lightbox .prev { left: 14px; } .lightbox .next { right: 14px; }
.lightbox .thumbs { display: flex; gap: 8px; overflow-x: auto; padding: 14px 20px 20px; justify-content: center; }
.lightbox .thumbs button { width: 72px; height: 54px; flex: none; border-radius: 8px; border: 2px solid transparent; background: center/cover; cursor: pointer; opacity: .6; }
.lightbox .thumbs button.on { border-color: var(--orange); opacity: 1; }
.offline { padding: 80px 0; text-align: center; display: grid; gap: 14px; justify-items: center; }
.mobile-cta { display: none; }
@media (max-width: 1000px) {
  .layout { grid-template-columns: 1fr; gap: 0; }
  .cta { position: static; margin-top: 32px; }
  .similar { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 640px) {
  .gallery { grid-template-columns: 1fr; grid-template-rows: 1fr; height: 62vw; border-radius: var(--r); }
  .gallery button:not(:first-child) { display: none; }
  .facts { grid-template-columns: 1fr 1fr; }
  .feats { grid-template-columns: 1fr; }
  .similar { grid-template-columns: 1fr; }
  .mobile-cta { display: flex; gap: 10px; align-items: center; position: fixed; z-index: 900; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--border); padding: 12px var(--gutter) max(12px, env(safe-area-inset-bottom)); box-shadow: 0 -6px 20px rgb(7 32 69 / .08); }
  .mobile-cta b { font-size: 19px; }
  .mobile-cta .btn { margin-left: auto; }
  body { padding-bottom: 80px; }
}
.lightbox .lb-btn { color: #fff; }
.lightbox .lb-btn:hover { background: rgb(255 255 255 / .1); }
</style>
</head>
<body>
<main class="container" id="main">
  <div class="crumbs" id="crumbs"><a href="/woningen" id="back"><span data-i="back"></span>Terug naar zoeken</a></div>
  <div class="skeleton" style="height:420px"></div>
</main>
<div id="footer-slot"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/common.js"></script>
<script>
mountChrome("woningen");
document.querySelectorAll("[data-i]").forEach((e) => (e.outerHTML = icon(e.dataset.i)));
if (document.referrer.includes("/woningen")) $("back").onclick = (e) => { e.preventDefault(); history.back(); };
const ID = new URLSearchParams(location.search).get("id");

function describe(i) {
  // feitelijke omschrijving op basis van de gegevens van de aanbieder
  const delen = [];
  const soort = i.type === "kamer" ? "Kamer" : (i.kamers ? `Woning met ${i.kamers} ${i.kamers === 1 ? "kamer" : "kamers"}` : "Zelfstandige woning");
  delen.push(`${soort}${i.m2 ? ` van ${Math.round(i.m2)} m²` : ""} in ${i.plaats}${i.wijk && i.wijk !== i.plaats ? ", " + i.wijk : ""}.`);
  delen.push(`De kale huur is ${eur(i.huur)} per maand${i.totaal && i.totaal > i.huur ? `, inclusief servicekosten ${eur(i.totaal)}` : ""}.`);
  delen.push(`${SECTOR[i.sector] || "Huurwoning"}, aangeboden via ${i.bron}.`);
  return delen.join(" ");
}
function toewText(i) {
  return {
    inschrijfduur: "De woning gaat naar de kandidaat die het langst staat ingeschreven bij het portaal.",
    loting: "De woning wordt verloot onder alle geschikte kandidaten. Je inschrijfduur telt niet mee.",
    "wie eerst komt": "Wie het eerst reageert, maakt de meeste kans. Reageer dus snel.",
    hospiteren: "De huidige bewoners kiezen zelf hun nieuwe huisgenoot tijdens een kennismaking.",
    "vrije sector": "De verhuurder kiest uit de reacties, meestal op volgorde van binnenkomst.",
  }[i.toewijzing] || "Lees in de advertentie hoe de woning wordt toegewezen.";
}

async function load() {
  await Tracker.ready;
  let d;
  try { d = await (await fetch("/api/woning?id=" + encodeURIComponent(ID))).json(); } catch { d = {}; }
  const i = d.item;
  if (!i || d.offline) {
    $("main").innerHTML = `<div class="offline"><h1 style="font-size:30px">Deze woning is niet meer beschikbaar</h1><p class="muted">De advertentie is offline gehaald of de reactietermijn is verlopen.</p><a class="btn btn-primary" href="/woningen">Bekijk andere woningen</a></div>`;
    return;
  }
  document.title = `${i.adres}, ${i.plaats} · HuurHub`;
  const fotos = (i.fotos && i.fotos.length ? i.fotos : i.foto ? [i.foto] : []);
  const dl = deadline(i), fav = !!Tracker.get(i.id), t = Tracker.get(i.id);
  window.ITEMS_BY_ID = new Map([[i.id, i], ...d.vergelijkbaar.map((x) => [x.id, x])]);
  const g = fotos.slice(0, 5);
  const gal = g.length ? g.map((f, k) => `<button type="button" data-k="${k}" style="background-image:url('${esc(f).replace(/'/g, "%27")}')" aria-label="Foto ${k + 1} bekijken"></button>`).join("") : `<div class="noimg">${icon("home")}</div>`;
  const kenmerken = [...new Set([...(i.kenmerken || []), i.huurtoeslag ? "Huurtoeslag mogelijk" : null].filter(Boolean))];
  $("main").innerHTML = `
    <div class="crumbs"><a href="/woningen" id="back2">${icon("back")}Terug naar zoeken</a><span>/</span><span>${esc(i.plaats)}</span></div>
    <div class="gallery n${Math.max(1, Math.min(g.length, 5))}" id="gal">${gal}${fotos.length > 1 ? `<button class="btn btn-sm all" type="button" data-k="0" style="background:#fff;cursor:pointer">Alle ${fotos.length} foto's</button>` : ""}</div>
    <div class="layout">
      <div>
        <div class="head"><h1>${esc(i.adres)}</h1><div class="loc">${icon("pin")}${esc(i.plaats)}${i.wijk && i.wijk !== i.plaats ? ", " + esc(i.wijk) : ""}${i.postcode ? " · " + esc(i.postcode) : ""}</div>
          <div class="badges">${KANS.has(i.toewijzing) ? `<span class="badge badge-orange">${KANS_LABEL[i.toewijzing]}</span>` : ""}<span class="badge">${esc(SECTOR[i.sector] || "")}</span>${isNew(i) ? `<span class="badge badge-soft">Nieuw</span>` : ""}${i.doelgroep && !["iedereen"].includes(i.doelgroep) ? `<span class="badge">Voor ${esc(i.doelgroep)}</span>` : ""}</div></div>
        <div class="facts">
          <div class="fact">${icon("area")}<span>Oppervlakte</span><b>${i.m2 ? Math.round(i.m2) + " m²" : "Onbekend"}</b></div>
          <div class="fact">${icon("bed")}<span>${i.slaapkamers ? "Slaapkamers" : "Kamers"}</span><b>${i.slaapkamers || (i.type === "kamer" ? "1 kamer" : i.kamers || "Onbekend")}</b></div>
          <div class="fact">${icon("home")}<span>Type</span><b>${i.type === "kamer" ? "Kamer" : "Zelfstandig"}</b></div>
          <div class="fact">${icon("calendar")}<span>Beschikbaar</span><b>${esc(beschikbaarText(i) || "In overleg")}</b></div>
        </div>
        <div class="block"><h2>Omschrijving</h2><p class="desc">${esc(describe(i))}</p>${i.omschrijving ? `<p class="desc clamp" id="desc">${esc(i.omschrijving)}</p>${i.omschrijving.length > 600 ? `<button class="btn btn-sm" type="button" id="more" style="justify-self:start">Lees meer</button>` : ""}` : ""}</div>
        ${kenmerken.length ? `<div class="block"><h2>Kenmerken en voorzieningen</h2><ul class="feats">${kenmerken.map((k) => `<li>${icon("check")}${esc(k)}</li>`).join("")}</ul></div>` : ""}
        <div class="block"><h2>Zo reageer je</h2><ol class="steps">
          <li><div><b>Schrijf je in bij ${esc(i.bron)}.</b> Reageren kan alleen met een account bij het portaal van de aanbieder.</div></li>
          <li><div><b>Reageer${dl && dl.date ? ` vóór ${dl.date.toLocaleDateString("nl-NL", { day: "numeric", month: "long" })}` : ""}.</b> ${esc(toewText(i))}</div></li>
          <li><div><b>Houd je reactie bij.</b> Zet de woning in Mijn woningen op Gereageerd, zodat je overzicht houdt.</div></li>
        </ol></div>
        ${i.lat ? `<div class="block"><h2>Locatie</h2><div id="minimap"></div>${i.geoPrecisie === "plaats" ? `<p class="muted" style="font-size:13px">De exacte locatie is niet bekend; de kaart toont de plaats.</p>` : ""}</div>` : ""}
      </div>
      <aside class="cta">
        <div class="price">${eur(i.huur)} <small>/ maand</small></div>
        <dl>${i.totaal && i.totaal > i.huur ? `<dt>Inclusief servicekosten</dt><dd>${eur(i.totaal)}</dd>` : ""}<dt>Toewijzing</dt><dd>${esc(TOEWIJZING[i.toewijzing] || i.toewijzing)}</dd>${dl ? `<dt>Reageren</dt><dd style="${dl.soon ? "color:var(--red)" : ""}">${esc(dl.text)}</dd>` : ""}<dt>Aanbieder</dt><dd>${esc(i.bron)}</dd></dl>
        <hr>
        <a class="btn btn-primary btn-lg btn-block" href="${esc(i.url)}" target="_blank" rel="noopener">Reageer bij de aanbieder ${icon("ext")}</a>
        <div class="row"><button class="btn ${fav ? "on" : ""}" type="button" id="favbtn">${icon("heart")}<span>${fav ? "Opgeslagen" : "Bewaar"}</span></button><button class="btn" type="button" id="share">Deel</button></div>
        <label class="label">Status in Mijn woningen<select id="status"><option value="">Niet opgeslagen</option>${STATUSSEN.map(([v, l]) => `<option value="${v}" ${t?.status === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
        <p class="note">HuurHub verhuurt zelf geen woningen. Je reageert op de site van ${esc(i.bron)}.</p>
      </aside>
    </div>
    ${d.vergelijkbaar.length ? `<section style="padding-bottom:80px"><div class="section-head"><div><h2>Vergelijkbare woningen in de buurt</h2></div></div><div class="similar">${d.vergelijkbaar.map((x) => PropertyCard(x)).join("")}</div></section>` : ""}
    <div class="mobile-cta"><div><b>${eur(i.huur)}</b><div class="muted" style="font-size:12.5px">per maand</div></div><a class="btn btn-primary" href="${esc(i.url)}" target="_blank" rel="noopener">Reageer ${icon("ext")}</a></div>`;
  if (document.referrer.includes("/woningen")) $("back2").onclick = (e) => { e.preventDefault(); history.back(); };
  if ($("more")) $("more").onclick = () => { $("desc").classList.toggle("clamp"); $("more").textContent = $("desc").classList.contains("clamp") ? "Lees meer" : "Lees minder"; };
  $("gal").addEventListener("click", (e) => { const b = e.target.closest("[data-k]"); if (b && fotos.length) lightbox(fotos, +b.dataset.k); });
  const syncFav = () => { const s = Tracker.get(i.id); $("favbtn").querySelector("span").textContent = s ? "Opgeslagen" : "Bewaar"; $("favbtn").style.color = s ? "var(--orange)" : ""; $("status").value = s?.status || ""; };
  $("favbtn").onclick = async () => { await Tracker.toggleFav(i); syncFav(); };
  $("status").onchange = async () => { await Tracker.set(i, $("status").value); syncFav(); if ($("status").value) toast("Opgeslagen in Mijn woningen", { label: "Bekijk", href: "/woningen#mijn" }); };
  $("share").onclick = async () => { try { await navigator.clipboard.writeText(location.href); toast("Link gekopieerd"); } catch { toast("Kopieer de link uit de adresbalk"); } };
  syncFav();
  if (i.lat) {
    const mm = L.map("minimap", { scrollWheelZoom: false, zoomControl: true }).setView([i.lat, i.lon], i.geoPrecisie === "plaats" ? 12 : 15);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, className: "tiles-soft", attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(mm);
    L.marker([i.lat, i.lon], { icon: L.divIcon({ className: "", iconSize: [22, 22], html: `<div class="pin" style="width:22px;height:22px;background:var(--orange)"></div>` }) }).addTo(mm);
  }
}
function lightbox(f, k) {
  const el = document.createElement("div"); el.className = "lightbox"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "Foto's");
  const draw = () => { el.innerHTML = `<header><span>${k + 1} / ${f.length}</span><button class="btn btn-ghost lb-btn" type="button" data-x aria-label="Sluiten">${icon("x")}</button></header>
    <div class="stage"><img src="${esc(f[k])}" alt="Foto ${k + 1}">${f.length > 1 ? `<button class="icon-btn nav-b prev" type="button" data-p aria-label="Vorige">${icon("back")}</button><button class="icon-btn nav-b next" type="button" data-n aria-label="Volgende">${icon("arrow")}</button>` : ""}</div>
    <div class="thumbs">${f.map((s, j) => `<button type="button" data-j="${j}" class="${j === k ? "on" : ""}" style="background-image:url('${esc(s).replace(/'/g, "%27")}')" aria-label="Foto ${j + 1}"></button>`).join("")}</div>`; };
  const close = () => { el.remove(); removeEventListener("keydown", key); document.body.style.overflow = ""; };
  const key = (e) => { if (e.key === "Escape") close(); if (e.key === "ArrowRight") { k = (k + 1) % f.length; draw(); } if (e.key === "ArrowLeft") { k = (k - 1 + f.length) % f.length; draw(); } };
  el.onclick = (e) => { if (e.target.closest("[data-x]") || e.target === el) close(); else if (e.target.closest("[data-n]")) { k = (k + 1) % f.length; draw(); } else if (e.target.closest("[data-p]")) { k = (k - 1 + f.length) % f.length; draw(); } else if (e.target.closest("[data-j]")) { k = +e.target.closest("[data-j]").dataset.j; draw(); } };
  addEventListener("keydown", key); document.body.style.overflow = "hidden"; draw(); document.body.appendChild(el);
}
load();
</script>
</body>
</html>
