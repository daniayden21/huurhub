<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HuurHub</title>
<link rel="icon" href="/img/favicon.png">
<link rel="stylesheet" href="/style.css">
<style>
.phead { background: var(--gray-bg); padding-block: 64px 56px; border-bottom: 1px solid var(--border); }
.phead h1 { font-size: clamp(34px, 4.6vw, 52px); letter-spacing: -0.035em; }
.phead p { font-size: 18px; color: var(--text-2); margin-top: 14px; max-width: 60ch; }
.pbody { padding-block: 64px 96px; }
.prose { max-width: 760px; display: grid; gap: 16px; color: var(--text-2); font-size: 16px; }
.prose h2 { color: var(--navy); font-size: 24px; margin-top: 18px; }
.prose h3 { color: var(--navy); font-size: 18px; margin-top: 8px; }
.prose ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.prose a { color: var(--orange); font-weight: 600; }
.prose .note { background: var(--blue-bg); border-radius: var(--r-sm); padding: 14px 16px; color: var(--navy); font-size: 14.5px; }
.steps3 { display: grid; gap: 72px; }
.step { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: 56px; align-items: center; }
.step:nth-child(even) .t { order: 2; }
.step .n { width: 44px; height: 44px; border-radius: 12px; background: var(--navy); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 18px; margin-bottom: 18px; }
.step h2 { font-size: clamp(24px, 2.8vw, 32px); }
.step p { color: var(--text-2); font-size: 16.5px; margin-top: 12px; }
.step ul { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 10px; }
.step li { display: flex; gap: 10px; color: var(--text-2); }
.step li .icon { color: var(--orange); margin-top: 3px; }
.shot { border-radius: var(--r-lg); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow-lg); }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.card { border: 1px solid var(--border); border-radius: var(--r-lg); padding: 24px; display: grid; gap: 8px; align-content: start; background: #fff; }
.card h3 { font-size: 18px; }
.card .fig { font-size: 22px; font-weight: 800; color: var(--orange); }
.card p { color: var(--text-2); font-size: 14.5px; }
.faq { display: grid; gap: 12px; max-width: 820px; }
.faq details { border: 1px solid var(--border); border-radius: var(--r); padding: 18px 22px; background: #fff; }
.faq summary { font-weight: 700; font-size: 16.5px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: ""; width: 12px; height: 12px; flex: none; border-right: 2px solid var(--navy); border-bottom: 2px solid var(--navy); transform: rotate(45deg); transition: transform .2s; margin-top: -6px; }
.faq details[open] summary::after { transform: rotate(-135deg); margin-top: 4px; }
.faq details p { color: var(--text-2); margin-top: 12px; }
.formcard { max-width: 640px; border: 1px solid var(--border); border-radius: var(--r-lg); padding: 28px; display: grid; gap: 16px; background: #fff; box-shadow: var(--shadow); }
.formcard .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.formgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; align-items: start; }
.done { display: grid; gap: 10px; justify-items: start; }
.done .ok { width: 48px; height: 48px; border-radius: 50%; background: var(--green-soft); color: var(--green); display: grid; place-items: center; }
.srcs { display: flex; flex-wrap: wrap; gap: 8px; }
.srcs span { border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; font-size: 14px; font-weight: 600; color: var(--navy); background: #fff; }
.credits { font-size: 13.5px; display: grid; gap: 4px; }
.credits a { color: var(--text-2); font-weight: 500; }
.ctabox { margin-top: 72px; background: var(--navy); color: #fff; border-radius: var(--r-lg); padding: 40px; display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap; }
.ctabox h2 { font-size: 28px; color: #fff; }
.ctabox p { opacity: .8; margin-top: 6px; }
@media (max-width: 900px) { .step, .formgrid { grid-template-columns: 1fr; gap: 28px; } .step:nth-child(even) .t { order: 0; } .cards { grid-template-columns: 1fr; } .formcard .two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main id="page"></main>
<div id="footer-slot"></div>
<script src="/common.js"></script>
<script src="/pagina.js"></script>
</body>
</html>
